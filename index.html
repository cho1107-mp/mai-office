<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<meta name="mobile-web-app-capable" content="yes">
<title>MAI PASSPORT 사무실</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bar:56px;--bg:#F4F2EE;--ink:#1A1A1A;--brand:#FF6F16;--muted:#5C5853;--line:#E4E0D9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
  #frames{position:fixed;left:0;right:0;top:0;bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
  #frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
  #frames iframe.on{display:block}
  nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
      background:#fff;border-top:1px solid var(--line);display:flex;align-items:stretch;gap:6px;padding-left:12px;padding-right:12px}
  nav button{font:inherit;border:0;background:none;cursor:pointer}
  .tab{flex:1;max-width:220px;margin:6px 0;border-radius:12px;font-size:17px;font-weight:700;color:var(--muted)}
  .tab.on{background:var(--ink);color:#fff}
  .sp{flex:1}
  .tool{margin:6px 0;min-width:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line)!important;font-size:15px;font-weight:600;color:var(--ink)}
  .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:17px;padding:24px}
  .msg.on{display:flex}
</style>
</head>
<body>
<div id="frames"><div class="msg" id="empty"></div></div>
<nav id="nav"></nav>
<script>
/* 탭 설정: 주소만 바꾸면 됨. url이 비어 있는 탭은 숨겨짐 */
var TABS = [
  { id: 'scan',  label: '출고 검수', frame: 'inv', mode: 'tablet', url: 'https://script.google.com/a/macros/maipassport.com/s/AKfycbyO6L9kct-pfrFyMGqOjmT5J97G0pVKCgWOq9t2nxLYC0fVw80qSbCoCHs9nXqGlzsX/exec?mode=tablet&shell=1' },
  { id: 'io',    label: '입출고',   frame: 'inv', mode: 'normal', url: 'https://script.google.com/a/macros/maipassport.com/s/AKfycbyO6L9kct-pfrFyMGqOjmT5J97G0pVKCgWOq9t2nxLYC0fVw80qSbCoCHs9nXqGlzsX/exec?mode=normal&shell=1' },
  { id: 'dash',  label: '현황판',   url: 'https://script.google.com/a/macros/maipassport.com/s/AKfycbwqey6hvk8BfHWTmXdF7MRQG3e2_SAG0ZejOHaQ2mVrYcejSx0IS4dRFm-3We7ysKkHag/exec?shell=1' },
  { id: 'label', label: '라벨 출력', url: 'https://script.google.com/a/macros/maipassport.com/s/AKfycbzUl5A_XTIuxJ3ttCMo4-l-axPJyBNm9p4aKEkm3b9A0BLyGFtPIqjHmuDu2FtW-P99gA/exec?shell=1' }
].filter(function (t) { return t.url; });

var frames = {}, cur = null, KEY = 'mp_shell_tab';
function $(id) { return document.getElementById(id); }

/* 출고 검수·입출고는 같은 앱 화면 하나를 같이 씀 → 탭을 바꾸면 모드만 바뀌고 다시 불러오지 않음 */
function frameKey(t) { return t.frame || t.id; }
function sendMode(t) {
  if (!t.mode) return;
  var f = frames[frameKey(t)]; if (!f) return;
  var msg = { type: 'mp-mode', mode: t.mode };
  // 앱 화면은 구글 쪽 iframe 몇 겹 안에 있어서, 안쪽 화면 전부에 보냄 (앱이 github.io에서 온 것만 받음)
  function walk(w, depth) {
    try { w.postMessage(msg, '*'); } catch (e) {}
    if (depth > 3) return;
    try { for (var i = 0; i < w.frames.length; i++) walk(w.frames[i], depth + 1); } catch (e) {}
  }
  function post() { if (f.contentWindow) walk(f.contentWindow, 0); }
  post(); setTimeout(post, 300); setTimeout(post, 1500);
}
function show(id) {
  var t = TABS.filter(function (x) { return x.id === id; })[0] || TABS[0];
  var key = frameKey(t);
  if (!frames[key]) {
    var f = document.createElement('iframe');
    f.src = t.url; f.title = t.label;
    f.allow = 'autoplay; clipboard-write';
    f.addEventListener('load', function () { var c = TABS.filter(function (x) { return x.id === cur; })[0]; if (c && frameKey(c) === key) setTimeout(function () { sendMode(c); }, 1500); });
    $('frames').appendChild(f); frames[key] = f;
  }
  Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', k === key); });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b.dataset.id === t.id); });
  cur = t.id;
  sendMode(t);
  try { localStorage.setItem(KEY, t.id); } catch (e) {}
  setTimeout(function () { try { frames[key].focus(); frames[key].contentWindow.focus(); } catch (e) {} }, 50);
}

function reloadCur() {
  // 열려 있는 모든 화면을 새로 불러옴 (뒤에 숨어 있는 탭도 최신 버전으로)
  Object.keys(frames).forEach(function (key) {
    var f = frames[key];
    var c = TABS.filter(function (x) { return x.id === cur && frameKey(x) === key; })[0] || TABS.filter(function (x) { return frameKey(x) === key; })[0];
    if (!f || !c) return;
    f.src = 'about:blank';
    setTimeout(function () { f.src = c.url; }, 50);
  });
}

// 각 웹앱의 버튼에서 탭 전환 요청 (예: 재고 앱 [현황판] → {type:'mp-tab', tab:'dash'})
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.type !== 'mp-tab') return;
  if (!/(\.|^)(google\.com|googleusercontent\.com)$/.test(new URL(e.origin).hostname)) return;
  if (d.tab === 'scan' || d.tab === 'inventory') show('scan'); else show(d.tab);
});

$('nav').innerHTML = TABS.map(function (t) { return '<button class="tab" type="button" data-id="' + t.id + '">' + t.label + '</button>'; }).join('') +
  '<span class="sp"></span><button class="tool" type="button" id="fs" title="주소창 없이 전체 화면">전체 화면</button><button class="tool" type="button" id="reload" title="모든 화면 새로고침">새로고침</button>';
$('nav').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  goFull();
  if (b.id === 'fs') return;
  if (b.id === 'reload') return reloadCur();
  show(b.dataset.id);
});

/* 전체 화면: 앱으로 설치하지 않고 크롬 탭에서 열어도 주소창을 숨김 (아래 탭을 누를 때마다 다시 시도) */
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches; }
function goFull() {
  if (isFull()) return;
  var el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn) { try { var r = fn.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(function () {}); } catch (e) {} }
}
function syncFsBtn() { var b = document.getElementById('fs'); if (b) b.style.display = isFull() ? 'none' : ''; }
document.addEventListener('fullscreenchange', syncFsBtn);
document.addEventListener('webkitfullscreenchange', syncFsBtn);
syncFsBtn();

if (!TABS.length) { $('empty').textContent = '연결된 화면이 없어요'; $('empty').classList.add('on'); }
else {
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  show(saved || TABS[0].id);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
